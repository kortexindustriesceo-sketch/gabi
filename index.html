<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramo de girasoles 🌻</title>
<style>
  :root{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    font-family:'Georgia','Times New Roman',serif;
    background: radial-gradient(circle at 50% 25%, #1b1b45 0%, #08081a 75%);
    color:#f5e6b8;
    overflow-x:hidden;
  }
  body{ min-height:100vh; position:relative; }

  /* Intro screen */
  .intro{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
    background: radial-gradient(circle at 50% 30%, #1b1b45 0%, #08081a 75%);
    transition: opacity 0.7s ease;
  }
  .intro.hide{ opacity:0; pointer-events:none; }
  .intro .emoji{ font-size:2.6rem; margin-bottom:6px; }
  .intro h1{ font-size:1.4rem; margin:0 0 10px; color:#ffd54f; text-shadow:0 0 14px rgba(255,213,79,0.55); }
  .intro p{ font-size:1rem; max-width:320px; line-height:1.6; margin:0 0 26px; color:#f5e6b8; }
  .intro button{
    font-family:inherit; font-size:1.05rem; font-weight:bold;
    padding:14px 30px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#ffe082,#f3a712); color:#4a2f12;
    box-shadow:0 8px 22px rgba(243,167,18,0.45);
    transition: transform 0.15s ease;
  }
  .intro button:active{ transform: scale(0.95); }

  /* Main content */
  .content{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; opacity:0; transition: opacity 0.6s ease;
  }
  .content.started{ opacity:1; }
  h2{ font-size:1.35rem; margin:0 0 14px; color:#ffd54f; text-shadow:0 0 14px rgba(255,213,79,0.55);}
  .wrap{ width:min(380px,88vw); }
  svg{ width:100%; height:auto; overflow:visible; }
  .star{ fill:#fff; opacity:0.5; animation: twinkle 3s ease-in-out infinite; }
  .star.s2{ animation-delay:-1s; }
  .star.s3{ animation-delay:-2s; }
  @keyframes twinkle{ 0%,100%{opacity:0.2;} 50%{opacity:0.8;} }

  /* Reveal / assembly animation */
  .reveal{ opacity:0; transform-box: fill-box; transform-origin:center; transform:scale(0.3); transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1); }
  .reveal.show{ opacity:1; transform:scale(1); }
  .reveal-line{ opacity:0; transition: opacity 0.5s ease; }
  .reveal-line.show{ opacity:1; }

  .flower{ transform-box: fill-box; transform-origin: center; }
  .flower.floaton{ animation: float 4.5s ease-in-out infinite; }
  .flower.d1{ animation-delay:0s; }
  .flower.d2{ animation-delay:-0.9s; }
  .flower.d3{ animation-delay:-1.8s; }
  .flower.d4{ animation-delay:-2.7s; }
  .flower.d5{ animation-delay:-3.6s; }
  .flower.d6{ animation-delay:-0.5s; }
  .flower.d7{ animation-delay:-2.2s; }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-5px) rotate(1.2deg); }
  }
  .signature{ margin-top:14px; font-style:italic; color:#e8c96a; }

  .mute-btn{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:5;
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,0.12); color:#ffd54f; font-size:1.15rem;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity 0.5s ease;
  }
  .mute-btn.visible{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>

  <div class="intro" id="intro">
    <div class="emoji">🌻💛</div>
    <h1>Tengo algo para ti</h1>
    <p>Un pequeño detalle para alegrarte el día. Presiona el botón para armar tu ramo.</p>
    <button id="startBtn">Armar el ramo 🌻</button>
  </div>

  <!--
    Para poner tu propia canción:
    1) Convierte tu mp3 a base64 (por ejemplo en https://base64.guru/converter/encode/audio)
    2) Pega el resultado dentro de src="data:audio/mpeg;base64,AQUI_TU_BASE64"
    3) Si dejas el src vacío, la página usa la melodía generada como respaldo.
  -->
  <audio id="bgMusic" loop preload="none">
    <source src="Floricienta_-_Flores_Amarillas_Karaoke_Karaoke_(mp3.pm).mp3" type="audio/mpeg">
  </audio>

  <button class="mute-btn" id="muteBtn" aria-label="Silenciar música">🔊</button>

  <div class="content" id="content">
    <h2>Un ramo de girasoles para ti 🌻</h2>

    <div class="wrap">
      <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="petalGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#fff3b0"/>
            <stop offset="55%" stop-color="#ffcb2e"/>
            <stop offset="100%" stop-color="#f39c12"/>
          </radialGradient>
          <radialGradient id="centerGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#7a5222"/>
            <stop offset="60%" stop-color="#4a2f12"/>
            <stop offset="100%" stop-color="#241407"/>
          </radialGradient>
          <linearGradient id="vaseGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3c65c"/>
            <stop offset="100%" stop-color="#d99a2b"/>
          </linearGradient>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

          <g id="petal12">
            <path d="M0,-4 C-9,-22 -9,-42 0,-56 C9,-42 9,-22 0,-4 Z" fill="url(#petalGrad)" stroke="#e8890b" stroke-width="0.6"/>
          </g>

          <g id="sunflower">
            <g filter="url(#glow)">
              <g>
                <use href="#petal12" transform="rotate(0)"/>
                <use href="#petal12" transform="rotate(30)"/>
                <use href="#petal12" transform="rotate(60)"/>
                <use href="#petal12" transform="rotate(90)"/>
                <use href="#petal12" transform="rotate(120)"/>
                <use href="#petal12" transform="rotate(150)"/>
                <use href="#petal12" transform="rotate(180)"/>
                <use href="#petal12" transform="rotate(210)"/>
                <use href="#petal12" transform="rotate(240)"/>
                <use href="#petal12" transform="rotate(270)"/>
                <use href="#petal12" transform="rotate(300)"/>
                <use href="#petal12" transform="rotate(330)"/>
              </g>
              <g opacity="0.9">
                <use href="#petal12" transform="rotate(15) scale(0.62)"/>
                <use href="#petal12" transform="rotate(45) scale(0.62)"/>
                <use href="#petal12" transform="rotate(75) scale(0.62)"/>
                <use href="#petal12" transform="rotate(105) scale(0.62)"/>
                <use href="#petal12" transform="rotate(135) scale(0.62)"/>
                <use href="#petal12" transform="rotate(165) scale(0.62)"/>
                <use href="#petal12" transform="rotate(195) scale(0.62)"/>
                <use href="#petal12" transform="rotate(225) scale(0.62)"/>
                <use href="#petal12" transform="rotate(255) scale(0.62)"/>
                <use href="#petal12" transform="rotate(285) scale(0.62)"/>
                <use href="#petal12" transform="rotate(315) scale(0.62)"/>
                <use href="#petal12" transform="rotate(345) scale(0.62)"/>
              </g>
              <circle cx="0" cy="0" r="15" fill="url(#centerGrad)"/>
              <g fill="#1a0d04" opacity="0.6">
                <circle cx="-5" cy="-4" r="1.4"/><circle cx="3" cy="-6" r="1.4"/><circle cx="7" cy="1" r="1.4"/>
                <circle cx="2" cy="7" r="1.4"/><circle cx="-6" cy="5" r="1.4"/><circle cx="0" cy="0" r="1.4"/>
                <circle cx="-9" cy="0" r="1.2"/><circle cx="9" cy="-2" r="1.2"/>
              </g>
            </g>
          </g>
        </defs>

        <!-- background stars -->
        <circle class="star s1" cx="40" cy="60" r="1.6"/>
        <circle class="star s2" cx="360" cy="40" r="1.4"/>
        <circle class="star s3" cx="330" cy="110" r="1.2"/>
        <circle class="star s2" cx="60" cy="140" r="1.2"/>
        <circle class="star s1" cx="20" cy="220" r="1.4"/>
        <circle class="star s3" cx="380" cy="200" r="1.6"/>

        <!-- stems -->
        <g stroke-linecap="round" fill="none">
          <g class="reveal-line stem-anim">
            <path d="M200 345 L200 60" stroke="#2f6b2f" stroke-width="7"/>
            <path d="M200 345 L200 60" stroke="#4a9c4a" stroke-width="2.5"/>
          </g>
          <g class="reveal-line stem-anim">
            <path d="M200 345 L128 98" stroke="#2f6b2f" stroke-width="7"/>
            <path d="M200 345 L128 98" stroke="#4a9c4a" stroke-width="2.5"/>
          </g>
          <g class="reveal-line stem-anim">
            <path d="M200 345 L272 98" stroke="#2f6b2f" stroke-width="7"/>
            <path d="M200 345 L272 98" stroke="#4a9c4a" stroke-width="2.5"/>
          </g>
          <g class="reveal-line stem-anim">
            <path d="M200 345 L84 160" stroke="#2f6b2f" stroke-width="7"/>
            <path d="M200 345 L84 160" stroke="#4a9c4a" stroke-width="2.5"/>
          </g>
          <g class="reveal-line stem-anim">
            <path d="M200 345 L316 160" stroke="#2f6b2f" stroke-width="7"/>
            <path d="M200 345 L316 160" stroke="#4a9c4a" stroke-width="2.5"/>
          </g>
          <g class="reveal-line stem-anim">
            <path d="M200 345 L150 198" stroke="#2f6b2f" stroke-width="7"/>
            <path d="M200 345 L150 198" stroke="#4a9c4a" stroke-width="2.5"/>
          </g>
          <g class="reveal-line stem-anim">
            <path d="M200 345 L250 198" stroke="#2f6b2f" stroke-width="7"/>
            <path d="M200 345 L250 198" stroke="#4a9c4a" stroke-width="2.5"/>
          </g>
        </g>

        <!-- leaves -->
        <g class="reveal leaf-anim">
          <path d="M150 225 C 110 208, 68 208, 40 232 C 62 252, 100 254, 132 236 C 140 232, 146 228, 150 225 Z" fill="#2f6b2f"/>
          <path d="M150 225 C 118 226, 85 234, 58 240" stroke="#1e4a1e" stroke-width="1.6" fill="none" opacity="0.6"/>
        </g>
        <g class="reveal leaf-anim">
          <path d="M250 225 C 290 208, 332 208, 360 232 C 338 252, 300 254, 268 236 C 260 232, 254 228, 250 225 Z" fill="#2f6b2f"/>
          <path d="M250 225 C 282 226, 315 234, 342 240" stroke="#1e4a1e" stroke-width="1.6" fill="none" opacity="0.6"/>
        </g>
        <g class="reveal leaf-anim">
          <path d="M162 268 C 128 256, 92 259, 70 280 C 90 297, 122 297, 148 280 C 154 276, 158 272, 162 268 Z" fill="#357a35"/>
          <path d="M162 268 C 134 271, 106 278, 82 282" stroke="#1e4a1e" stroke-width="1.6" fill="none" opacity="0.6"/>
        </g>
        <g class="reveal leaf-anim">
          <path d="M238 268 C 272 256, 308 259, 330 280 C 310 297, 278 297, 252 280 C 246 276, 242 272, 238 268 Z" fill="#357a35"/>
          <path d="M238 268 C 266 271, 294 278, 318 282" stroke="#1e4a1e" stroke-width="1.6" fill="none" opacity="0.6"/>
        </g>

        <!-- bow -->
        <g class="reveal bow-anim">
          <path d="M198 335 C 178 322, 152 322, 140 338 C 130 352, 142 368, 162 366 C 180 364, 194 350, 198 335 Z" fill="url(#vaseGrad)" stroke="#b9791f" stroke-width="2.5"/>
          <path d="M202 335 C 222 322, 248 322, 260 338 C 270 352, 258 368, 238 366 C 220 364, 206 350, 202 335 Z" fill="url(#vaseGrad)" stroke="#b9791f" stroke-width="2.5"/>
          <ellipse cx="200" cy="342" rx="11" ry="13" fill="#f3c65c" stroke="#b9791f" stroke-width="2.5"/>
        </g>

        <!-- stem ends below the bow -->
        <g class="reveal-line tip-anim" stroke="#2f6b2f" stroke-width="6" fill="none" stroke-linecap="round">
          <path d="M200 358 L188 395"/>
          <path d="M200 358 L200 400"/>
          <path d="M200 358 L212 395"/>
        </g>
        <g class="reveal-line tip-anim" stroke="#4a9c4a" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M200 358 L188 395"/>
          <path d="M200 358 L200 400"/>
          <path d="M200 358 L212 395"/>
        </g>

        <!-- flowers -->
        <g class="reveal flower-anim"><use class="flower d3" href="#sunflower" x="200" y="58" transform="scale(1.08)"/></g>
        <g class="reveal flower-anim"><use class="flower d1" href="#sunflower" x="128" y="96"/></g>
        <g class="reveal flower-anim"><use class="flower d2" href="#sunflower" x="272" y="96"/></g>
        <g class="reveal flower-anim"><use class="flower d4" href="#sunflower" x="84" y="158" transform="scale(0.88)"/></g>
        <g class="reveal flower-anim"><use class="flower d5" href="#sunflower" x="316" y="158" transform="scale(0.88)"/></g>
        <g class="reveal flower-anim"><use class="flower d6" href="#sunflower" x="150" y="196" transform="scale(0.82)"/></g>
        <g class="reveal flower-anim"><use class="flower d7" href="#sunflower" x="250" y="196" transform="scale(0.82)"/></g>
      </svg>
    </div>

    <div class="signature">Con cariño, para ti 💛</div>
  </div>

<script>
  const intro = document.getElementById('intro');
  const content = document.getElementById('content');
  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');

  startBtn.addEventListener('click', () => {
    intro.classList.add('hide');
    content.classList.add('started');
    muteBtn.classList.add('visible');
    setTimeout(() => { intro.style.display = 'none'; }, 700);

    startMusic();

    const order = [
      ...document.querySelectorAll('.stem-anim'),
      ...document.querySelectorAll('.leaf-anim'),
      ...document.querySelectorAll('.bow-anim'),
      ...document.querySelectorAll('.tip-anim'),
      ...document.querySelectorAll('.flower-anim')
    ];

    order.forEach((el, i) => {
      setTimeout(() => {
        el.classList.add('show');
        if (el.classList.contains('flower-anim')) {
          const use = el.querySelector('.flower');
          if (use) setTimeout(() => use.classList.add('floaton'), 550);
        }
      }, i * 90);
    });
  });

  // ---- Music: uses your own mp3 if provided above, otherwise a generated fallback melody ----
  const bgMusic = document.getElementById('bgMusic');
  let usingMp3 = false;
  let audioCtx = null;
  let musicOn = true;
  let musicTimer = null;
  const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33]; // C5 D5 E5 G5 A5 ...

  function playNote(freq, time, dur, vol){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0008, time + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + dur + 0.05);
  }

  function playPhrase(){
    if (!musicOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    scale.forEach((freq, i) => {
      playNote(freq, t + i * 0.45, 0.55, 0.06);
    });
    playNote(261.63, t, scale.length * 0.45, 0.04);
  }

  function startMusic(){
    const src = bgMusic.querySelector('source').getAttribute('src');
    if (src && src.trim() !== '') {
      usingMp3 = true;
      bgMusic.volume = 0.5;
      bgMusic.play().catch(() => {});
      return;
    }
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      playPhrase();
      musicTimer = setInterval(playPhrase, scale.length * 450);
    }catch(e){ /* audio unavailable, fail silently */ }
  }

  muteBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    muteBtn.textContent = musicOn ? '🔊' : '🔇';
    if (usingMp3) {
      if (musicOn) bgMusic.play().catch(() => {});
      else bgMusic.pause();
      return;
    }
    if (musicOn) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (!musicTimer) { playPhrase(); musicTimer = setInterval(playPhrase, scale.length * 450); }
    } else {
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    }
  });
</script>
</body>
</html>
